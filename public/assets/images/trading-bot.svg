<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crypto Spot Trading Bot — candlestick chart with risk engine status">
  <defs>
    <radialGradient id="tb-glow1" cx="12%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-glow2" cx="92%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-glow3" cx="50%" cy="108%" r="70%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tb-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="tb-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="750" fill="#0b1120"/>
  <rect width="1200" height="750" fill="url(#tb-grid)"/>
  <rect width="1200" height="750" fill="url(#tb-glow1)"/>
  <rect width="1200" height="750" fill="url(#tb-glow2)"/>
  <rect width="1200" height="750" fill="url(#tb-glow3)"/>

  <!-- main glass panel -->
  <rect x="150" y="110" width="900" height="530" rx="26" fill="#0f172a" fill-opacity="0.72" stroke="#94a3b8" stroke-opacity="0.22"/>
  <rect x="150.5" y="110.5" width="899" height="529" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- window chrome -->
  <circle cx="192" cy="148" r="7" fill="#ef4444" fill-opacity="0.75"/>
  <circle cx="218" cy="148" r="7" fill="#f59e0b" fill-opacity="0.75"/>
  <circle cx="244" cy="148" r="7" fill="#34d399" fill-opacity="0.85"/>

  <!-- pair + state pills -->
  <rect x="184" y="186" width="150" height="30" rx="15" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.2"/>
  <text x="259" y="207" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="600" fill="#e2e8f0" letter-spacing="1">BTC/USDT</text>

  <rect x="346" y="186" width="120" height="30" rx="15" fill="#94a3b8" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.2"/>
  <text x="406" y="207" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" fill="#94a3b8">1h · spot</text>

  <rect x="836" y="186" width="178" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
  <circle cx="856" cy="201" r="5" fill="#34d399"/>
  <text x="870" y="206" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14" font-weight="600" fill="#34d399">RISK: TRADING</text>

  <!-- chart area -->
  <g transform="translate(184 240)">
    <!-- bollinger band -->
    <path d="M0 150 C 80 120, 140 130, 200 100 S 340 60, 420 70 S 560 40, 640 60 S 760 30, 832 45 L 832 245 S 760 230, 640 240 S 560 220, 420 240 S 340 230, 200 250 S 80 270, 0 250 Z" fill="url(#tb-band)"/>
    <path d="M0 150 C 80 120, 140 130, 200 100 S 340 60, 420 70 S 560 40, 640 60 S 760 30, 832 45" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
    <path d="M0 250 C 80 270, 140 260, 200 250 S 340 230, 420 240 S 560 220, 640 240 S 760 230, 832 245" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- mid line -->
    <path d="M0 200 C 80 195, 140 190, 200 175 S 340 145, 420 155 S 560 130, 640 150 S 760 130, 832 145" fill="none" stroke="url(#tb-line)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- candles: x, open->close body, wick -->
    <g stroke-width="2" stroke-linecap="round">
      <line x1="24" y1="176" x2="24" y2="234" stroke="#f87171"/><rect x="17" y="190" width="14" height="30" rx="2" fill="#f87171"/>
      <line x1="64" y1="182" x2="64" y2="228" stroke="#34d399"/><rect x="57" y="194" width="14" height="22" rx="2" fill="#34d399"/>
      <line x1="104" y1="170" x2="104" y2="222" stroke="#34d399"/><rect x="97" y="180" width="14" height="28" rx="2" fill="#34d399"/>
      <line x1="144" y1="160" x2="144" y2="204" stroke="#f87171"/><rect x="137" y="170" width="14" height="22" rx="2" fill="#f87171"/>
      <line x1="184" y1="148" x2="184" y2="200" stroke="#34d399"/><rect x="177" y="158" width="14" height="30" rx="2" fill="#34d399"/>
      <line x1="224" y1="134" x2="224" y2="186" stroke="#34d399"/><rect x="217" y="144" width="14" height="26" rx="2" fill="#34d399"/>
      <line x1="264" y1="146" x2="264" y2="196" stroke="#f87171"/><rect x="257" y="156" width="14" height="28" rx="2" fill="#f87171"/>
      <line x1="304" y1="150" x2="304" y2="200" stroke="#f87171"/><rect x="297" y="160" width="14" height="24" rx="2" fill="#f87171"/>
      <line x1="344" y1="130" x2="344" y2="184" stroke="#34d399"/><rect x="337" y="140" width="14" height="30" rx="2" fill="#34d399"/>
      <line x1="384" y1="118" x2="384" y2="170" stroke="#34d399"/><rect x="377" y="128" width="14" height="26" rx="2" fill="#34d399"/>
      <line x1="424" y1="126" x2="424" y2="176" stroke="#f87171"/><rect x="417" y="136" width="14" height="24" rx="2" fill="#f87171"/>
      <line x1="464" y1="110" x2="464" y2="164" stroke="#34d399"/><rect x="457" y="120" width="14" height="30" rx="2" fill="#34d399"/>
      <line x1="504" y1="96" x2="504" y2="150" stroke="#34d399"/><rect x="497" y="106" width="14" height="28" rx="2" fill="#34d399"/>
      <line x1="544" y1="108" x2="544" y2="156" stroke="#f87171"/><rect x="537" y="118" width="14" height="22" rx="2" fill="#f87171"/>
      <line x1="584" y1="120" x2="584" y2="170" stroke="#f87171"/><rect x="577" y="130" width="14" height="26" rx="2" fill="#f87171"/>
      <line x1="624" y1="112" x2="624" y2="166" stroke="#34d399"/><rect x="617" y="122" width="14" height="30" rx="2" fill="#34d399"/>
      <line x1="664" y1="100" x2="664" y2="152" stroke="#34d399"/><rect x="657" y="110" width="14" height="26" rx="2" fill="#34d399"/>
      <line x1="704" y1="108" x2="704" y2="156" stroke="#f87171"/><rect x="697" y="118" width="14" height="22" rx="2" fill="#f87171"/>
      <line x1="744" y1="92" x2="744" y2="146" stroke="#34d399"/><rect x="737" y="102" width="14" height="30" rx="2" fill="#34d399"/>
      <line x1="784" y1="80" x2="784" y2="134" stroke="#34d399"/><rect x="777" y="90" width="14" height="28" rx="2" fill="#34d399"/>
      <line x1="824" y1="88" x2="824" y2="138" stroke="#f87171"/><rect x="817" y="98" width="14" height="22" rx="2" fill="#f87171"/>
    </g>

    <!-- entry marker -->
    <circle cx="184" cy="188" r="9" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
    <text x="184" y="222" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#34d399" letter-spacing="1">BUY</text>
    <!-- exit marker -->
    <circle cx="784" cy="90" r="9" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-width="2"/>
    <text x="784" y="70" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#22d3ee" letter-spacing="1">TP</text>
  </g>

  <!-- footer gates -->
  <g transform="translate(184 548)">
    <text x="0" y="14" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#64748b" letter-spacing="2">PRE-TRADE GATES</text>
    <g transform="translate(0 28)">
      <rect x="0" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="78" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="156" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="234" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="312" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="390" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="468" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="546" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="624" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <rect x="702" y="0" width="70" height="8" rx="4" fill="#34d399" fill-opacity="0.85"/>
      <text x="832" y="9" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" fill="#34d399">10/10</text>
    </g>
  </g>
</svg>
